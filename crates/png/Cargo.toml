[[bin]]
name = "sillstone-png-gen-ref"
path = "tools/gen-reference/main.rs"

[package]
name = "sillstone-png"
license = "Apache-2.0"
description = "PNG decoding for 8/16-bit colour images, including Adam7 interlacing (zero-dep Rust)"
readme = "README.md"
categories = [ "algorithms", "cryptography",]
keywords = [ "png", "image", "decoder", "adam7", "hashing",]

[lib]
crate-type = [ "cdylib", "rlib",]

[features]
default = [ "std",]
std = []

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.repository]
workspace = true

[package.homepage]
workspace = true

[package.authors]
workspace = true

[dependencies.sillstone-digest]
version = "0.2.1"
path = "../digest"

[dependencies.sillstone-inflate]
version = "0.2.1"
path = "../inflate"

[dependencies.sillstone-image]
version = "0.2.1"
path = "../image"

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
