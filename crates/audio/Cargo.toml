[[bin]]
name = "sillstone-audio-gen-ref"
path = "tools/gen-reference/main.rs"

[package]
name = "sillstone-audio"
license = "Apache-2.0"
description = "Audio fingerprinting: RIFF/WAVE and FLAC decode, Shazam-style spectral-peak signatures and delta-t histogram matching"
readme = "README.md"
categories = [ "algorithms", "cryptography",]
keywords = [ "audio", "wav", "fingerprinting", "pcm", "hashing",]

[lib]
crate-type = [ "cdylib", "rlib",]

[features]
default = [ "std",]
std = []

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.repository]
workspace = true

[package.homepage]
workspace = true

[package.authors]
workspace = true

[dependencies.sillstone-digest]
version = "0.3.0-beta.1"
path = "../digest"

[dependencies.sillstone-flac]
version = "0.3.0-beta.1"
path = "../flac"

[dependencies.sillstone-math]
version = "0.3.0-beta.1"
path = "../math"

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
