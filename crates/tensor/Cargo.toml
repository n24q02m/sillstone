[package]
name = "sillstone-tensor"
license = "Apache-2.0"
description = "Pure-Rust N-dimensional strided tensor and array computing engine (NumPy replacement, zero-dep Rust)"
readme = "README.md"
categories = ["algorithms", "mathematics", "science"]
keywords = ["tensor", "numpy", "array", "matrix", "broadcasting"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = []

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.repository]
workspace = true

[package.homepage]
workspace = true

[package.authors]
workspace = true

[dependencies.sillstone-digest]
version = "0.3.0-beta.1"
path = "../digest"

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
