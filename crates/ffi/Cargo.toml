[package]
name = "sillstone-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "C ABI and FFI bridge export for Sillstone"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "allow"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[dependencies]
sillstone-buffer = { version = "0.2.1", path = "../buffer" }
sillstone-digest = { version = "0.2.1", path = "../digest" }
sillstone-math = { version = "0.2.1", path = "../math" }
sillstone-unicode = { version = "0.2.1", path = "../unicode" }
sillstone-curator = { version = "0.2.1", path = "../curator" }
sillstone-image = { version = "0.2.1", path = "../image" }
sillstone-text = { version = "0.2.1", path = "../text" }
sillstone-tensor = { version = "0.2.1", path = "../tensor" }
