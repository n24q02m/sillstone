[[bin]]
name = "sillstone-jpeg-gen-ref"
path = "tools/gen-reference/main.rs"

[package]
name = "sillstone-jpeg"
description = "pith jpeg lane: baseline and progressive JPEG decoding, byte-exact with libjpeg islow (zero-dep Rust)"
readme = "README.md"
license = "Apache-2.0"
categories = [ "algorithms", "multimedia::encoding",]

[lib]
crate-type = [ "cdylib", "rlib",]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.repository]
workspace = true

[package.homepage]
workspace = true

[package.authors]
workspace = true

[dependencies.sillstone-digest]
path = "../digest"

[dependencies.sillstone-image]
path = "../image"

[dependencies.sillstone-math]
path = "../math"

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
