[[bin]]
name = "sillstone-file-gen-ref"
path = "tools/gen-reference/main.rs"

[package]
name = "sillstone-file"
license = "Apache-2.0"
description = "File-domain hashing for the pith suite: FastCDC chunk signatures, exact chunk-set Jaccard, PDF text extraction"
readme = "README.md"
categories = [ "algorithms", "cryptography",]
keywords = [ "fastcdc", "deduplication", "jaccard", "pdf", "hashing",]

[lib]
crate-type = [ "cdylib", "rlib",]

[features]
default = [ "std",]
std = []

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.repository]
workspace = true

[package.homepage]
workspace = true

[package.authors]
workspace = true

[dependencies.sillstone-digest]
version = "0.3.0-beta.2"
path = "../digest"

[dependencies.sillstone-cdc]
version = "0.3.0-beta.2"
path = "../cdc"

[dependencies.sillstone-pdf]
version = "0.3.0-beta.2"
path = "../pdf"
[dependencies.sillstone-zip]
version = "0.3.0-beta.2"
path = "../zip"

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
