[[bin]]
name = "sillstone-curator-gen-ref"
path = "tools/gen-reference/main.rs"

[package]
name = "sillstone-curator"
description = "The pith suite curator: detect, tier-1 content hash, tier-2 signatures, match, calibrate and the pith CLI."
readme = "README.md"
license = "Apache-2.0"
categories = [ "algorithms", "cryptography",]

[lib]
crate-type = [ "cdylib", "rlib",]

[features]
default = [ "std",]
std = []

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.repository]
workspace = true

[package.homepage]
workspace = true

[package.authors]
workspace = true

[dependencies.sillstone-digest]
path = "../digest"

[dependencies.sillstone-math]
path = "../math"

[dependencies.sillstone-image]
path = "../image"

[dependencies.sillstone-png]
path = "../png"

[dependencies.sillstone-jpeg]
path = "../jpeg"

[dependencies.sillstone-text]
path = "../text"

[dependencies.sillstone-audio]
path = "../audio"

[dependencies.sillstone-flac]
path = "../flac"

[dependencies.sillstone-mp3]
path = "../mp3"

[dependencies.sillstone-mp4]
path = "../mp4"

[dependencies.sillstone-h264]
path = "../h264"

[dependencies.sillstone-video]
path = "../video"

[dependencies.sillstone-file]
path = "../file"

[dependencies.sillstone-pdf]
path = "../pdf"

[dev-dependencies.sillstone-unicode]
path = "../unicode"

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
