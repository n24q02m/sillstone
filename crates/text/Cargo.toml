[[bin]]
name = "sillstone-text-gen-ref"
path = "tools/gen-reference/main.rs"

[package]
name = "sillstone-text"
license = "Apache-2.0"
description = "Text fingerprints: NFC canonicalisation, word 3-shingles and a 128-word MinHash signature"
readme = "README.md"
categories = [ "algorithms", "cryptography",]
keywords = [ "text", "minhash", "similarity", "fingerprint", "hashing",]

[lib]
crate-type = [ "cdylib", "rlib",]

[features]
default = [ "std",]
std = []

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.repository]
workspace = true

[package.homepage]
workspace = true

[package.authors]
workspace = true

[dependencies.sillstone-digest]
version = "0.2.0-beta.1"
path = "../digest"

[dependencies.sillstone-unicode]
version = "0.2.0-beta.1"
path = "../unicode"

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
