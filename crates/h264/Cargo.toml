[[bin]]
name = "sillstone-h264-gen-ref"
path = "tools/gen-reference/main.rs"

[package]
name = "sillstone-h264"
license = "Apache-2.0"
description = "H.264/AVC subset decoding: NAL/SPS/PPS, CAVLC+CABAC slices, transforms, in-loop deblocking"
readme = "README.md"
categories = [ "algorithms", "cryptography",]
keywords = [ "h264", "avc", "video", "decoder", "hashing",]

[lib]
crate-type = [ "cdylib", "rlib",]

[features]
default = [ "std",]
std = []

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.repository]
workspace = true

[package.homepage]
workspace = true

[package.authors]
workspace = true

[dependencies.sillstone-digest]
version = "0.2.1"
path = "../digest"

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
