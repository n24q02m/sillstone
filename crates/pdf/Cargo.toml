[[bin]]
name = "sillstone-pdf-gen-ref"
path = "tools/gen-reference/main.rs"

[package]
name = "sillstone-pdf"
license = "Apache-2.0"
description = "PDF text extraction across classic xref, xref streams, cmap and CID fonts"
readme = "README.md"
categories = [ "algorithms", "cryptography",]
keywords = [ "pdf", "text-extraction", "cmap", "fonts", "hashing",]

[lib]
crate-type = [ "cdylib", "rlib",]

[features]
default = [ "std",]
std = []

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.repository]
workspace = true

[package.homepage]
workspace = true

[package.authors]
workspace = true

[dependencies.sillstone-digest]
path = "../digest"

[dependencies.sillstone-inflate]
path = "../inflate"

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
