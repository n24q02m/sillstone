name: Bench

# Manual only: repeated parity + speed runs against hashlib / imagehash / Pillow
# / NumPy on the hosted runners. Writes the raw per-run JSON as an artifact.
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Full-suite repetitions per OS (the acceptance bar is >= 5)"
        default: "5"

permissions:
  contents: read

jobs:
  bench:
    name: Bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build FFI Dynamic Library (release)
        run: cargo build --release -p sillstone-ffi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install oracles
        run: python -m pip install pillow numpy imagehash

      - name: Runner CPU
        shell: bash
        run: |
          python - <<'EOF'
          import platform
          print(platform.platform(), platform.machine(), platform.processor())
          EOF
          if [ "$RUNNER_OS" = "Linux" ]; then grep -m1 "model name" /proc/cpuinfo; grep -m1 -o -w "sha_ni\|avx2" /proc/cpuinfo | sort -u; fi
          if [ "$RUNNER_OS" = "macOS" ]; then sysctl -n machdep.cpu.brand_string; fi

      - name: Probe PyWavelets Haar arithmetic
        run: python scripts/bench/probe_pywt_fma.py

      - name: Hash parity and speed (repeated)
        run: python scripts/bench/bench_hash_parity.py --repeats ${{ inputs.repeats }} --json bench-hash-${{ matrix.os }}.json

      - name: Image / array engine vs Pillow and NumPy
        run: python scripts/bench/bench_parity.py

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-hash-${{ matrix.os }}.json
