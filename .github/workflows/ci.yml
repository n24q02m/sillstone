name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ============================================================================
  # Support matrices: every list below is DERIVED, never listed. The resolver reads
  # the floors this repository already declares -- requires-python in
  # sdk/python/pyproject.toml, engines.node in sdk/node/package.json,
  # maven.compiler.release in sdk/java/pom.xml, the go directive in sdk/go/go.mod and
  # rust-version in Cargo.toml -- and the matrix jobs consume them through
  # needs.versions.outputs.*. A hand-pinned row is exactly how a matrix falls behind
  # a release, so scripts/ci/test_ci_versions.py fails if a literal pin for any of
  # these five languages is added back to this file.
  # ============================================================================
  versions:
    name: Resolve support matrix
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.resolve.outputs.python }}
      python-newest: ${{ steps.resolve.outputs.python-newest }}
      node: ${{ steps.resolve.outputs.node }}
      node-newest: ${{ steps.resolve.outputs.node-newest }}
      java: ${{ steps.resolve.outputs.java }}
      java-newest: ${{ steps.resolve.outputs.java-newest }}
      go: ${{ steps.resolve.outputs.go }}
      go-newest: ${{ steps.resolve.outputs.go-newest }}
      rust: ${{ steps.resolve.outputs.rust }}
      rust-newest: ${{ steps.resolve.outputs.rust-newest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Deliberately NOT actions/setup-python: the resolver runs on the runner's
      # stock python3, so no interpreter pinned in this file can decide what the
      # matrix says. scripts/ci_versions.py is stdlib-only for that reason.
      - name: Show the resolved windows
        run: python3 scripts/ci_versions.py --format plain

      - name: Resolve the language matrices
        id: resolve
        run: python3 scripts/ci_versions.py --format github >> "$GITHUB_OUTPUT"

      - name: Guard the workflow against hand-written pins
        run: python3 -m unittest scripts/ci/test_ci_versions.py -v

  test:
    name: Test (${{ matrix.os }})
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Workspace Check
        run: cargo check --workspace --all-targets

      - name: Rust Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust Workspace Test
        run: cargo test --workspace --lib --tests
      - name: IDL Generator Sync Check
        run: cargo run -p sillstone-idl-gen -- --check

      - name: Verify Reference JSON
        run: cargo run -p sillstone-curator --bin sillstone-curator-gen-ref -- verify
      - name: Build FFI Dynamic Library
        run: cargo build -p sillstone-ffi
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.versions.outputs.python-newest }}

      - name: Install Python parity oracles
        run: python -m pip install pillow==13.0.0 numpy imagehash

      - name: Python SDK Tests
        run: python -m unittest discover -s sdk/python/tests

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.versions.outputs.node-newest }}

      - name: Build Node.js N-API Addon
        run: node sdk/node/scripts/build.js

      - name: Node.js SDK Tests
        run: node --test sdk/node/test/checksum.test.js sdk/node/test/reference.test.js sdk/node/test/tensor.test.js sdk/node/test/image.test.js sdk/node/test/array.test.js sdk/node/test/tlsh.test.js

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ needs.versions.outputs.java-newest }}

      - name: Java SDK Tests
        working-directory: sdk/java
        run: mvn test -DargLine="-Djava.library.path=../../target/debug"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.versions.outputs.go-newest }}

      - name: Go SDK Tests
        working-directory: sdk/go/sillstone
        shell: bash
        run: |
          ROOT="$(cd ../../.. && pwd)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp ../../../target/debug/sillstone_ffi.dll . 2>/dev/null || true
            trap 'rm -f sillstone_ffi.dll' EXIT
          fi
          export LD_LIBRARY_PATH="$ROOT/target/debug:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$ROOT/target/debug:${DYLD_LIBRARY_PATH:-}"
          go test -v ./...
      - name: Verify Documentation & Parity
        run: python scripts/check-docs-parity.py
      - name: Verify Zero Dependencies
        run: python scripts/ci/check-zero-deps.py

      - name: Verify Clean Identity Separation
        run: python scripts/ci/check-forbidden-traces.py

  coverage:
    name: Coverage (measured)
    # The pinned gate runs on the newest row the resolver declares, never on a
    # version typed here.
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # One instrumented build feeds every consumer of the library: the Rust
      # tests, the generators, and the Python and Java SDK suites that load
      # the cdylib. The FFI and JNI shims have no Rust-side callers, so only
      # the SDK suites reach them; the report merges all the profiles.
      - name: Instrument workspace
        run: |
          cargo llvm-cov show-env --export-prefix > "$RUNNER_TEMP/llvm-cov-env.sh"
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          cargo llvm-cov clean --workspace

      - name: Rust workspace tests
        run: |
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          cargo test --workspace --lib --tests

      - name: Generators and reference gates
        run: |
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          cargo run -p sillstone-idl-gen -- --check
          cargo run -p sillstone-curator --bin sillstone-curator-gen-ref -- verify

      - name: Build instrumented FFI library
        run: |
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          cargo build -p sillstone-ffi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.versions.outputs.python-newest }}

      - name: Install Python test dependencies
        run: python -m pip install pillow==13.0.0 numpy imagehash pytest pytest-cov

      - name: Python binding coverage
        run: |
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          python -m pytest sdk/python/tests --cov=sillstone --cov-report=json:py-cov.json --cov-report=term-missing

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ needs.versions.outputs.java-newest }}

      - name: Java binding tests (profile the JNI shim)
        working-directory: sdk/java
        run: |
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          mvn test -DargLine="-Djava.library.path=$GITHUB_WORKSPACE/target/debug"

      - name: Rust line coverage (merged profiles)
        run: |
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          cargo llvm-cov report --json --summary-only --output-path rust-cov.json
          # Per-line detail so the artifact shows which lines are still unexecuted,
          # not only the per-file totals the report below summarises.
          cargo llvm-cov report --lcov --output-path rust-cov.lcov

      - name: Report Rust coverage
        # --fail-under makes the 95% target in docs/scorecard.md a gate instead of a
        # printout: measuring a shortfall and staying green is the claim without proof.
        run: python scripts/ci/coverage_report.py llvm rust-cov.json --target 95 --fail-under 95

      - name: Report Python coverage
        run: python scripts/ci/coverage_report.py py py-cov.json --target 95 --fail-under 95

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            rust-cov.json
            rust-cov.lcov
            py-cov.json

  # ============================================================================
  # Per-language version matrices. Each job proves one support window from the
  # floor the package declares to the newest line this repository can install; the
  # rows come from needs.versions.outputs.* and nothing here names a version.
  #
  # The Windows/macOS angling of every SDK stays in the Test job above: these jobs
  # vary the interpreter, not the OS, so a floor row that fails is a floor row and
  # not a runner image.
  # ============================================================================
  python-matrix:
    name: Python ${{ matrix.python-version }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      # A floor row that fails is the finding, not a reason to cancel the others.
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.versions.outputs.python) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build FFI Dynamic Library
        run: cargo build -p sillstone-ffi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The same oracle set as the Test and Coverage jobs, pinned to the same Pillow.
      # The resize/parity suites compare against Pillow bit for bit, so an unpinned
      # oracle would let each row define "parity" for itself: measured locally, the
      # suite passes against Pillow 13.0.0 and fails four resize comparisons against
      # 12.3.0. Pillow 13 installs from 3.11, which is where the resolver's window
      # starts; a row below that is reported as excluded, not tested against an
      # oracle that disagrees with the claim.
      - name: Install Python parity oracles
        run: python -m pip install pillow==13.0.0 numpy imagehash

      - name: Python SDK Tests
        run: python -m unittest discover -s sdk/python/tests

  # ============================================================================
  # The source distribution. `pip install --no-binary sillstone` has to compile
  # the cdylib from the crates inside the archive, and nothing above builds that
  # archive: the CD workflow is dispatch-only, so a broken sdist could reach
  # PyPI and only fail on a user's machine. This job builds it, installs it from
  # source into a clean venv and makes every native entry point answer. The
  # wheels are unaffected — they never take this route.
  # ============================================================================
  python-sdist:
    name: Python sdist (build from source)
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ needs.versions.outputs.python-newest }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.versions.outputs.python-newest }}

      # `scripts/build-sdist.py` stages the crates `sillstone-ffi` links as
      # rust/ beside setup.py; a bare `python -m build --sdist sdk/python`
      # cannot reach crates/ above the project root and is refused by setup.py.
      - name: Build the source distribution
        run: |
          python -m pip install --upgrade build
          python scripts/build-sdist.py --outdir "$RUNNER_TEMP/sdist"

      - name: Test the packaging gates
        run: python -m unittest discover -s scripts/ci -p "test_*.py"

      - name: Verify the archive carries what the install compiles
        run: python scripts/ci/check-package-contents.py sdist "$RUNNER_TEMP/sdist/*.tar.gz"

      # A clean venv, and `--no-binary sillstone` so this row can never be
      # satisfied by a wheel: the archive itself has to build.
      - name: Install the sdist from source into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          python="$RUNNER_TEMP/sdist-venv/bin/python"
          "$python" -m pip install --upgrade pip
          "$python" -m pip install --no-cache-dir --no-binary sillstone "$RUNNER_TEMP"/sdist/*.tar.gz

      # An import proves nothing here: the wrapper loads the cdylib lazily, so
      # only a native call that has to answer correctly shows the build worked.
      - name: Exercise the compiled extension
        run: |
          "$RUNNER_TEMP/sdist-venv/bin/python" scripts/ci/smoke-python.py

  node-matrix:
    name: Node.js ${{ matrix.node-version }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.versions.outputs.node) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build FFI Dynamic Library
        run: cargo build -p sillstone-ffi

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build Node.js N-API Addon
        run: node sdk/node/scripts/build.js

      - name: Node.js SDK Tests
        # The runner's bash expands the list, so a new test file is picked up here
        # without editing this workflow.
        run: node --test sdk/node/test/*.test.js

  java-matrix:
    name: Java ${{ matrix.java-version }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ${{ fromJSON(needs.versions.outputs.java) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build FFI Dynamic Library
        run: cargo build -p sillstone-ffi

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: Java SDK Tests
        working-directory: sdk/java
        run: mvn test -DargLine="-Djava.library.path=../../target/debug"

  go-matrix:
    name: Go ${{ matrix.go-version }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(needs.versions.outputs.go) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build FFI Dynamic Library
        run: cargo build -p sillstone-ffi

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Go SDK Tests
        working-directory: sdk/go/sillstone
        run: |
          ROOT="$(cd ../../.. && pwd)"
          export LD_LIBRARY_PATH="$ROOT/target/debug:${LD_LIBRARY_PATH:-}"
          go test -v ./...

  rust-matrix:
    name: Rust ${{ matrix.rust-version }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: ${{ fromJSON(needs.versions.outputs.rust) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # @master carries the `toolchain` input, so the row is data and the action
      # reference stays free of a version. Clippy is not run here on purpose: its
      # lint set moves with the toolchain, and the MSRV row is about compiling and
      # passing tests, not about today's warnings.
      - name: Set up Rust ${{ matrix.rust-version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-version }}

      - name: Rust Workspace Check
        run: cargo check --workspace --all-targets

      - name: Rust Workspace Test
        run: cargo test --workspace --lib --tests
