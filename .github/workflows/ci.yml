name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Workspace Check
        run: cargo check --workspace --all-targets

      - name: Rust Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust Workspace Test
        run: cargo test --workspace --lib --tests
      - name: IDL Generator Sync Check
        run: cargo run -p sillstone-idl-gen -- --check

      - name: Verify Reference JSON
        run: cargo run -p sillstone-curator --bin sillstone-curator-gen-ref -- verify
      - name: Build FFI Dynamic Library
        run: cargo build -p sillstone-ffi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install Python parity oracles
        run: python -m pip install pillow numpy imagehash

      - name: Python SDK Tests
        run: python -m unittest discover -s sdk/python/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Node.js N-API Addon
        run: node sdk/node/scripts/build.js

      - name: Node.js SDK Tests
        run: node --test sdk/node/test/checksum.test.js sdk/node/test/reference.test.js sdk/node/test/tensor.test.js sdk/node/test/image.test.js sdk/node/test/array.test.js

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Java SDK Tests
        working-directory: sdk/java
        run: mvn test -DargLine="-Djava.library.path=../../target/debug"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Go SDK Tests
        working-directory: sdk/go/sillstone
        shell: bash
        run: |
          ROOT="$(cd ../../.. && pwd)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp ../../../target/debug/sillstone_ffi.dll . 2>/dev/null || true
            trap 'rm -f sillstone_ffi.dll' EXIT
          fi
          export LD_LIBRARY_PATH="$ROOT/target/debug:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$ROOT/target/debug:${DYLD_LIBRARY_PATH:-}"
          go test -v ./...
      - name: Verify Documentation & Parity
        run: python scripts/check-docs-parity.py
      - name: Verify Zero Dependencies
        run: python scripts/ci/check-zero-deps.py

      - name: Verify Clean Identity Separation
        run: python scripts/ci/check-forbidden-traces.py
