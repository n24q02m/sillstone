name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Workspace Check
        run: cargo check --workspace --all-targets

      - name: Rust Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust Workspace Test
        run: cargo test --workspace --lib --tests
      - name: IDL Generator Sync Check
        run: cargo run -p sillstone-idl-gen -- --check

      - name: Verify Reference JSON
        run: cargo run -p sillstone-curator --bin sillstone-curator-gen-ref -- verify
      - name: Build FFI Dynamic Library
        run: cargo build -p sillstone-ffi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install Python parity oracles
        run: python -m pip install pillow==13.0.0 numpy imagehash

      - name: Python SDK Tests
        run: python -m unittest discover -s sdk/python/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Node.js N-API Addon
        run: node sdk/node/scripts/build.js

      - name: Node.js SDK Tests
        run: node --test sdk/node/test/checksum.test.js sdk/node/test/reference.test.js sdk/node/test/tensor.test.js sdk/node/test/image.test.js sdk/node/test/array.test.js

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Java SDK Tests
        working-directory: sdk/java
        run: mvn test -DargLine="-Djava.library.path=../../target/debug"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Go SDK Tests
        working-directory: sdk/go/sillstone
        shell: bash
        run: |
          ROOT="$(cd ../../.. && pwd)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp ../../../target/debug/sillstone_ffi.dll . 2>/dev/null || true
            trap 'rm -f sillstone_ffi.dll' EXIT
          fi
          export LD_LIBRARY_PATH="$ROOT/target/debug:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$ROOT/target/debug:${DYLD_LIBRARY_PATH:-}"
          go test -v ./...
      - name: Verify Documentation & Parity
        run: python scripts/check-docs-parity.py
      - name: Verify Zero Dependencies
        run: python scripts/ci/check-zero-deps.py

      - name: Verify Clean Identity Separation
        run: python scripts/ci/check-forbidden-traces.py

  coverage:
    name: Coverage (measured)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # One instrumented build feeds every consumer of the library: the Rust
      # tests, the generators, and the Python and Java SDK suites that load
      # the cdylib. The FFI and JNI shims have no Rust-side callers, so only
      # the SDK suites reach them; the report merges all the profiles.
      - name: Instrument workspace
        run: |
          cargo llvm-cov show-env --export-prefix > "$RUNNER_TEMP/llvm-cov-env.sh"
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          cargo llvm-cov clean --workspace

      - name: Rust workspace tests
        run: |
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          cargo test --workspace --lib --tests

      - name: Generators and reference gates
        run: |
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          cargo run -p sillstone-idl-gen -- --check
          cargo run -p sillstone-curator --bin sillstone-curator-gen-ref -- verify

      - name: Build instrumented FFI library
        run: |
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          cargo build -p sillstone-ffi
          sed 's/=.*//' "$RUNNER_TEMP/llvm-cov-env.sh"
          echo "RUSTFLAGS=$RUSTFLAGS"
          echo "TARGET=${CARGO_TARGET_DIR:-unset} LLVMCOV=${CARGO_LLVM_COV_TARGET_DIR:-unset}"
          nm -D target/debug/libsillstone_ffi.so | grep -c llvm_profile || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install Python test dependencies
        run: python -m pip install pillow==13.0.0 numpy imagehash pytest pytest-cov

      - name: Python binding coverage
        run: python -m pytest sdk/python/tests --cov=sillstone --cov-report=json:py-cov.json --cov-report=term-missing

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Java binding tests (profile the JNI shim)
        working-directory: sdk/java
        run: mvn test -DargLine="-Djava.library.path=$GITHUB_WORKSPACE/target/debug"

      - name: Rust line coverage (merged profiles)
        run: |
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          cargo llvm-cov report --json --summary-only --output-path rust-cov.json

      - name: Report Rust coverage
        run: python scripts/ci/coverage_report.py llvm rust-cov.json --target 95

      - name: Report Python coverage
        run: python scripts/ci/coverage_report.py py py-cov.json --target 95

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            rust-cov.json
            py-cov.json
