name: CD

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - beta
          - stable
      publish_existing_tag:
        description: "Recovery only: re-run the build and publish jobs for a v* tag an earlier run already created (e.g. v0.4.1-beta.1), skipping semantic-release."
        required: false
        type: string
        default: ""

# The release version is computed by better-semantic-release (semantic-release.toml)
# from the conventional commits since the last v* tag; no job takes it as an input.
env:
  RELEASE_TYPE: ${{ inputs.release_type }}
  PLATFORMS: linux-x64 linux-arm64 darwin-arm64 darwin-x64 win32-x64

permissions:
  contents: write
  id-token: write

# ci-policy: allow concurrency reason: serialize releases, never cancel one mid-publish
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight & Conformance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo Lockfile
        run: cargo generate-lockfile
      - name: Zero Dependencies Gate
        run: python scripts/ci/check-zero-deps.py
      - name: Clean Identity Separation Gate
        run: python scripts/ci/check-forbidden-traces.py
      - name: Documentation Parity Gate
        run: python scripts/check-docs-parity.py
      - name: IDL Sync Gate
        run: cargo run -p sillstone-idl-gen -- --check
      - name: Verify Reference JSON
        run: cargo run -p sillstone-curator --bin sillstone-curator-gen-ref -- verify

  # better-semantic-release computes the next version from the conventional commits
  # since the last v* tag (beta: X.Y.Z-beta.N, stable: X.Y.Z), stamps it into every
  # manifest through scripts/ci/version_sync.py, updates CHANGELOG.md, then commits,
  # tags v<version> and pushes to main. Every later job checks out that tag. The
  # GitHub Release is not created here: the github-release job cuts it only after the
  # registry readback passes. With no releasable commit, released is false and the
  # rest of the pipeline is skipped.
  release:
    name: Semantic Release
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.release.outputs.released || steps.existing.outputs.released }}
      tag: ${{ steps.release.outputs.tag || steps.existing.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.existing.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease || steps.existing.outputs.is_prerelease }}
    steps:
      # The release commit and tag go straight to main, which the ruleset protects;
      # only the CI GitHub App is a bypass actor, GITHUB_TOKEN is not.
      - name: Generate GitHub App Token
        id: app-token
        if: inputs.publish_existing_tag == ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0
      - name: Compute, stamp, commit and tag the release version
        id: release
        if: inputs.publish_existing_tag == ''
        uses: n24q02m/better-semantic-release@0cc137a9f9254fb4163d727c20026cb81a5a6880 # v1.13.1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          config_file: semantic-release.toml
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: beta
          vcs_release: false
      # Recovery for a run that failed after its tag was pushed: the tag must be a
      # v<semver> tag on main whose manifests all carry its version, so this path can
      # only re-publish a version semantic-release already cut, never choose one.
      - name: Use an existing release tag (recovery)
        id: existing
        if: inputs.publish_existing_tag != ''
        env:
          TAG: ${{ inputs.publish_existing_tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error title=publish_existing_tag::$TAG is not a v<version> release tag"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error title=publish_existing_tag::tag $TAG does not exist"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error title=publish_existing_tag::tag $TAG is not on main"
            exit 1
          fi
          VERSION="${TAG#v}"
          git checkout --quiet "$TAG"
          python3 scripts/ci/version_sync.py check "$VERSION"
          {
            echo "released=true"
            echo "tag=$TAG"
            echo "version=$VERSION"
            if [[ "$VERSION" == *-* ]]; then echo "is_prerelease=true"; else echo "is_prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

  build-cdylib:
    name: Build cdylib (${{ matrix.platform }})
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            artifact: libsillstone_ffi.so
            target: ""
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            artifact: libsillstone_ffi.so
            target: ""
          - platform: darwin-arm64
            os: macos-latest
            artifact: libsillstone_ffi.dylib
            target: ""
          - platform: darwin-x64
            os: macos-latest
            artifact: libsillstone_ffi.dylib
            target: x86_64-apple-darwin
          - platform: win32-x64
            os: windows-latest
            artifact: sillstone_ffi.dll
            target: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add Cross-Compile Target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Build FFI cdylib
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build -p sillstone-ffi --release --target ${{ matrix.target }}
            mkdir -p target/release
            cp target/${{ matrix.target }}/release/${{ matrix.artifact }} target/release/
          else
            cargo build -p sillstone-ffi --release
          fi
        shell: bash
      - name: Upload cdylib artifact
        uses: actions/upload-artifact@v7
        with:
          name: cdylib-${{ matrix.platform }}
          retention-days: 5
          path: target/release/${{ matrix.artifact }}
          if-no-files-found: error
      - name: Build N-API addon
        shell: bash
        run: |
          export SILLSTONE_FFI_DIR="$(pwd)/target/release"
          export SILLSTONE_NAPI_OUT="$(pwd)/target/release/napi"
          if [ -n "${{ matrix.target }}" ]; then
            export SILLSTONE_NAPI_ARCH=x86_64
          fi
          node sdk/node/scripts/build.js
      - name: Smoke-test N-API addon next to its cdylib
        if: matrix.target == ''
        shell: bash
        run: node scripts/ci/smoke-napi.js "target/release/napi/sillstone_napi.node" "target/release/${{ matrix.artifact }}"
      - name: Upload N-API addon artifact
        uses: actions/upload-artifact@v7
        with:
          name: napi-${{ matrix.platform }}
          retention-days: 5
          path: target/release/napi/sillstone_napi.node
          if-no-files-found: error
      - name: Set up Python for wheel packaging
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Build Python wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build wheel
          export SILLSTONE_CDYLIB_DIR="$(pwd)/target/release"
          if [ -n "${{ matrix.target }}" ]; then
            export SILLSTONE_TARGET_ARCH="x86_64"
          fi
          python -m build --wheel sdk/python
          if [ "${{ runner.os }}" == "Linux" ]; then
            python -m pip install auditwheel
            # A failed repair must fail the job: the publish step deletes every
            # non-manylinux linux wheel, so a swallowed error would silently drop
            # the Linux wheel from the release.
            auditwheel repair sdk/python/dist/*.whl -w sdk/python/dist/repaired/
            repaired=(sdk/python/dist/repaired/*.whl)
            if [ "${#repaired[@]}" -ne 1 ] || [ ! -f "${repaired[0]}" ]; then
              echo "::error title=auditwheel::expected exactly one repaired wheel, found ${#repaired[@]}"
              exit 1
            fi
            case "${repaired[0]}" in
              *manylinux* | *musllinux*) ;;
              *)
                echo "::error title=auditwheel::repair produced a non-manylinux wheel: ${repaired[0]}"
                exit 1
                ;;
            esac
            rm -f sdk/python/dist/*.whl
            mv "${repaired[0]}" sdk/python/dist/
            rm -rf sdk/python/dist/repaired
          fi
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          retention-days: 5
          path: sdk/python/dist/*.whl
          if-no-files-found: error

  package-sdks:
    name: Package Multi-Language SDKs
    needs: [release, build-cdylib]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Download cdylib artifacts
        uses: actions/download-artifact@v8
        with:
          path: native-libs
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: sdk/python/dist
          merge-multiple: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Set up Rust for the source install
        uses: dtolnay/rust-toolchain@stable
      - name: Build Python sdist
        shell: bash
        run: |
          # One sdist serves every platform: it compiles the cdylib on the
          # installing machine, so it is built here rather than in the wheel
          # matrix. scripts/build-sdist.py stages the Rust workspace inside the
          # archive and re-checks the result before exiting.
          python -m pip install --upgrade build
          python scripts/build-sdist.py
      - name: Install the sdist from source and smoke-test it
        shell: bash
        run: |
          # The published archive must build on a machine that never saw this
          # checkout: pip unpacks it, compiles the cdylib with cargo, and the
          # resulting wheel has to answer every native call. The same script
          # runs in CI's `python-sdist` job, so a release cannot pass a check
          # the pull request that introduced the archive never ran.
          python -m venv "$RUNNER_TEMP/sdist-venv"
          python="$RUNNER_TEMP/sdist-venv/bin/python"
          "$python" -m pip install --upgrade pip
          "$python" -m pip install --no-cache-dir --no-binary sillstone sdk/python/dist/*.tar.gz
          "$python" scripts/ci/smoke-python.py
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Stage native prebuilds for npm & Java
        shell: bash
        run: |
          mkdir -p sdk/node/prebuilds/linux-x64 sdk/node/prebuilds/linux-arm64 sdk/node/prebuilds/darwin-arm64 sdk/node/prebuilds/darwin-x64 sdk/node/prebuilds/win32-x64
          cp native-libs/cdylib-linux-x64/libsillstone_ffi.so sdk/node/prebuilds/linux-x64/
          cp native-libs/cdylib-linux-arm64/libsillstone_ffi.so sdk/node/prebuilds/linux-arm64/
          cp native-libs/cdylib-darwin-arm64/libsillstone_ffi.dylib sdk/node/prebuilds/darwin-arm64/
          cp native-libs/cdylib-darwin-x64/libsillstone_ffi.dylib sdk/node/prebuilds/darwin-x64/
          cp native-libs/cdylib-win32-x64/sillstone_ffi.dll sdk/node/prebuilds/win32-x64/
          for p in linux-x64 linux-arm64 darwin-arm64 darwin-x64 win32-x64; do
            cp "native-libs/napi-$p/sillstone_napi.node" "sdk/node/prebuilds/$p/"
          done

          mkdir -p sdk/java/src/main/resources/io/github/sillstone/native/linux-x64
          mkdir -p sdk/java/src/main/resources/io/github/sillstone/native/linux-arm64
          mkdir -p sdk/java/src/main/resources/io/github/sillstone/native/darwin-arm64
          mkdir -p sdk/java/src/main/resources/io/github/sillstone/native/darwin-x64
          mkdir -p sdk/java/src/main/resources/io/github/sillstone/native/win32-x64
          cp native-libs/cdylib-linux-x64/libsillstone_ffi.so sdk/java/src/main/resources/io/github/sillstone/native/linux-x64/
          cp native-libs/cdylib-linux-arm64/libsillstone_ffi.so sdk/java/src/main/resources/io/github/sillstone/native/linux-arm64/
          cp native-libs/cdylib-darwin-arm64/libsillstone_ffi.dylib sdk/java/src/main/resources/io/github/sillstone/native/darwin-arm64/
          cp native-libs/cdylib-darwin-x64/libsillstone_ffi.dylib sdk/java/src/main/resources/io/github/sillstone/native/darwin-x64/
          cp native-libs/cdylib-win32-x64/sillstone_ffi.dll sdk/java/src/main/resources/io/github/sillstone/native/win32-x64/
      - name: Package npm tarball and Java JAR
        shell: bash
        run: |
          # `files` in package.json lists README.md and LICENSE, but npm only
          # packs files that exist next to it; stage the repository's own.
          cp README.md LICENSE sdk/node/
          cd sdk/node && npm pack
          cd ../../sdk/java && mvn package -DskipTests
      - name: Verify Package Contents Gate
        shell: bash
        run: |
          echo "Verifying unit tests..."
          python -m unittest discover -s scripts/ci -p "test_*.py"
          echo "Verifying Python wheels..."
          python scripts/ci/check-package-contents.py wheels "sdk/python/dist/*.whl" --platforms linux-x64,linux-arm64,darwin-arm64,darwin-x64,win32-x64 --stem sillstone_ffi
          echo "Verifying Python sdist..."
          python scripts/ci/check-package-contents.py sdist "sdk/python/dist/*.tar.gz"
          echo "Verifying npm tarball..."
          python scripts/ci/check-package-contents.py npm "sdk/node/*.tgz" --platforms linux-x64,linux-arm64,darwin-arm64,darwin-x64,win32-x64 --stem sillstone_ffi --addon-stem sillstone_napi
          echo "Installing npm tarball into a clean project (linux-x64)..."
          SMOKE="$(mktemp -d)"
          (cd "$SMOKE" && npm init -y >/dev/null && npm install "$GITHUB_WORKSPACE"/sdk/node/*.tgz && node "$GITHUB_WORKSPACE/scripts/ci/smoke-npm.js")
          echo "Verifying Java JAR..."
          python scripts/ci/check-package-contents.py jar "sdk/java/target/*.jar" --platforms linux-x64,linux-arm64,darwin-arm64,darwin-x64,win32-x64 --stem sillstone_ffi --prefix io/github/sillstone/native
      - name: Upload packaged SDK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packaged-sdks
          retention-days: 5
          path: |
            sdk/python/dist/*.whl
            sdk/python/dist/*.tar.gz
            sdk/node/*.tgz
            sdk/java/target/*.jar

  publish:
    name: Publish Packages to Registries
    needs: [release, package-sdks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Download packaged SDK artifacts
        uses: actions/download-artifact@v8
        with:
          name: packaged-sdks
          path: artifacts
      - name: Organize downloaded SDK artifacts
        shell: bash
        run: |
          mkdir -p sdk/python/dist sdk/node sdk/java/target
          find artifacts -name "*.whl" -exec cp {} sdk/python/dist/ \;
          find artifacts -name "*.tar.gz" -exec cp {} sdk/python/dist/ \;
          find artifacts -name "*.tgz" -exec cp {} sdk/node/ \;
          find artifacts -name "*.jar" -exec cp {} sdk/java/target/ \;
          find sdk/python/dist -name "*linux_*.whl" ! -name "*manylinux*" ! -name "*musllinux*" -delete
          ls -la sdk/python/dist sdk/node sdk/java/target
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: 'https://registry.npmjs.org'
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          # Central Portal publishing: `server-id` must match
          # publishingServerId in the `release` profile of sdk/java/pom.xml.
          # An empty gpg-private-key (secret not configured) skips the import.
          server-id: central
          server-username: CENTRAL_PORTAL_USERNAME
          server-password: CENTRAL_PORTAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # crates.io Trusted Publishing: every sillstone crate trusts this repository's
      # cd.yml, so the job's OIDC token buys a 30-minute publish token and no
      # long-lived crates.io token is stored anywhere. A stored token died unnoticed
      # and failed the v0.4.1-beta.1 publish with "403 authentication failed".
      - name: Get a crates.io token through Trusted Publishing
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish Crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Trusted Publishing returned no crates.io token; refusing to report a publish that did not happen."
            exit 1
          fi
          publish_crate() {
            local out
            if out=$(cargo publish --manifest-path "$1/Cargo.toml" 2>&1); then
              echo "$out"
            elif echo "$out" | grep -Eq "already (exists|uploaded)"; then
              # Re-dispatch after a partial run: the version is already on
              # crates.io (index says "already exists", the upload API says
              # "already uploaded"). The release gate reads every version back.
              echo "::notice title=crates.io::$1 is already published, skipping"
            else
              echo "$out"
              return 1
            fi
          }
          {
            echo "Publishing crates to crates.io in dependency order..."
            CRATES=(
              crates/buffer
              crates/digest
              crates/math
              crates/inflate
              crates/unicode
              crates/flac
              crates/mp3
              crates/mp4
              crates/h264
              crates/qoi
              crates/tensor
              crates/image
              crates/png
              crates/jpeg
              crates/cdc
              crates/zip
              crates/pdf
              crates/text
              crates/audio
              crates/video
              crates/file
              crates/curator
              crates/cli
              crates/ffi
            )
            for c in "${CRATES[@]}"; do
              echo "Publishing $c..."
              publish_crate "$c"
              sleep 5
            done
          }
      - name: Publish Python Wheel to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          skip-existing: true
      - name: Publish npm package via Trusted Publisher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd sdk/node
          TGZ=$(ls *.tgz | tail -1)
          # Distinguish "version not on the registry" (E404) from a registry or
          # network failure: only E404 may fall through to a real publish.
          if view=$(npm view "sillstone@$RELEASE_VERSION" version 2>&1); then
            present=$view
          elif echo "$view" | grep -q "E404"; then
            present=""
          else
            echo "$view"
            echo "::error title=npm::cannot determine whether sillstone@$RELEASE_VERSION is on npm"
            exit 1
          fi
          if [ -n "$present" ]; then
            echo "::notice title=npm::sillstone@$RELEASE_VERSION is already on npm, skipping"
          elif [[ "$RELEASE_VERSION" == *-* ]]; then
            npm publish "$TGZ" --access public --tag beta --provenance
          else
            npm publish "$TGZ" --access public --provenance
          fi

  publish-java:
    name: Publish Java package to Maven Central
    needs: [release, package-sdks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Download packaged SDK artifacts
        uses: actions/download-artifact@v8
        with:
          name: packaged-sdks
          path: artifacts
      - name: Organize downloaded SDK artifacts
        shell: bash
        run: |
          mkdir -p sdk/java/target
          find artifacts -name "*.jar" -exec cp {} sdk/java/target/ \;
          python3 scripts/ci/stage-java-natives.py
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          server-id: central
          server-username: CENTRAL_PORTAL_USERNAME
          server-password: CENTRAL_PORTAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy to Maven Central
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -z "$CENTRAL_PORTAL_USERNAME" ] || [ -z "$CENTRAL_PORTAL_PASSWORD" ] || [ -z "$MAVEN_GPG_PRIVATE_KEY" ]; then
            if [[ "$RELEASE_VERSION" != *-* ]]; then
              echo "::error title=Maven Central::CENTRAL_PORTAL_USERNAME/CENTRAL_PORTAL_PASSWORD/MAVEN_GPG_PRIVATE_KEY are not configured; refusing to release a stable version without the Java package."
              exit 1
            fi
            echo "::warning title=Maven Central SKIPPED::Central Portal token or GPG key is not configured; sillstone-java $RELEASE_VERSION was NOT published."
            echo "### Maven Central: SKIPPED (no Central Portal token or GPG key), nothing was published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VERSION="$RELEASE_VERSION"
          if [ -n "$VERSION" ] && curl -fsS -o /dev/null \
            "https://repo1.maven.org/maven2/io/github/n24q02m/sillstone/${VERSION}/sillstone-${VERSION}.pom"; then
            echo "::notice title=Maven Central::sillstone ${VERSION} is already on Maven Central; skipping the deploy"
            echo "### Maven Central: already published (${VERSION})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Deploying to Maven Central via the Central Portal..."
          cd sdk/java && mvn -B -Prelease deploy -DskipTests

  publish-go:
    name: Publish Go SDK & Module Tag
    needs: [release, package-sdks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Push Go module tag and index on proxy.golang.org
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          V="$RELEASE_VERSION"
          TAG="sdk/go/v$V"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
          else
            git tag "$TAG" && git push origin "refs/tags/$TAG"
          fi
          # The proxy fetches the tag from GitHub on this first request. A reply other
          # than 200 means the module is not served, so the step fails after its retries
          # instead of leaving the release gate to find it an hour later. The retry
          # budget (7 tries of at most 20 s, 20 s apart) stays inside the job timeout.
          echo "Requesting $TAG from proxy.golang.org..."
          curl -fsS --retry 6 --retry-all-errors --retry-delay 20 --max-time 20 \
            "https://proxy.golang.org/github.com/n24q02m/sillstone/sdk/go/@v/v$V.info"
          echo
  release-gate:
    name: Release Gate & Registry Readback
    needs: [release, publish, publish-java, publish-go]
    runs-on: ubuntu-latest
    # The readback below waits up to an hour (--wait-seconds 3600) for Maven Central
    # to propagate, so the job limit sits above that wait instead of cutting it short.
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Check Registry Readiness
        run: |
          echo "Release type: $RELEASE_TYPE"
          echo "Release version: $RELEASE_VERSION"
          python -m unittest discover -s scripts/ci -p "test_*.py"
          # Central Portal publishes asynchronously: 0.3.2-beta.1 took over an hour to
          # appear on repo1, so the maven readback needs the full hour. -u keeps the
          # per-registry lines visible while the gate waits.
          python -u scripts/ci/check-registries.py --version "$RELEASE_VERSION" --wait-seconds 3600

  github-release:
    name: Tag and GitHub Release
    needs: [release, release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Install from registry and exercise native code
        run: |
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          echo '{"name":"smoke","version":"1.0.0"}' > package.json
          npm install "sillstone@$RELEASE_VERSION"
          node "$GITHUB_WORKSPACE/scripts/ci/smoke-npm.js"
      - name: Tag commit and publish release object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$RELEASE_VERSION"
          for t in "v$V" "sdk/go/v$V"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null 2>&1; then
              echo "$t already exists"
            else
              git tag "$t" && git push origin "refs/tags/$t"
            fi
          done
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "release v$V already exists"
          elif [[ "$V" == *-* ]]; then
            gh release create "v$V" --title "v$V" --generate-notes --verify-tag --prerelease
          else
            gh release create "v$V" --title "v$V" --generate-notes --verify-tag
          fi
      - name: Download packaged SDK artifacts
        uses: actions/download-artifact@v8
        with:
          name: packaged-sdks
          path: release-assets
      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$RELEASE_VERSION"
          # Keep the release object that already exists; only fill it when it
          # carries no assets, so a re-run never swaps published files.
          if [ "$(gh release view "v$V" --json assets --jq '.assets | length')" != "0" ]; then
            echo "release v$V already has assets, leaving them untouched"
            exit 0
          fi
          cd release-assets
          mapfile -t FILES < <(find . -type f \( -name '*.whl' -o -name '*.tgz' -o -name '*.jar' \) | sort)
          [ "${#FILES[@]}" -gt 0 ] || { echo "no packaged artifacts found"; exit 1; }
          sha256sum "${FILES[@]}" > SHA256SUMS.txt
          gh release upload "v$V" "${FILES[@]}" SHA256SUMS.txt
          gh release view "v$V" --json assets --jq '.assets[].name'
