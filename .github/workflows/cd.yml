name: CD

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - beta
          - stable
      expected_version:
        description: "Expected version to publish (e.g. 0.2.1)"
        required: false
        type: string
        default: "0.3.0"

env:
  RELEASE_TYPE: ${{ inputs.release_type }}
  EXPECTED_VERSION: ${{ inputs.expected_version }}
  PLATFORMS: linux-x64 linux-arm64 darwin-arm64 darwin-x64 win32-x64

permissions:
  contents: write
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight & Conformance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Version Consistency Gate
        run: python scripts/ci/version_sync.py check "${{ inputs.expected_version }}"
      - name: Generate Cargo Lockfile
        run: cargo generate-lockfile
      - name: Zero Dependencies Gate
        run: python scripts/ci/check-zero-deps.py
      - name: Clean Identity Separation Gate
        run: python scripts/ci/check-forbidden-traces.py
      - name: Documentation Parity Gate
        run: python scripts/check-docs-parity.py
      - name: IDL Sync Gate
        run: cargo run -p sillstone-idl-gen -- --check
      - name: Verify Reference JSON
        run: cargo run -p sillstone-curator --bin sillstone-curator-gen-ref -- verify

  build-cdylib:
    name: Build cdylib (${{ matrix.platform }})
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            artifact: libsillstone_ffi.so
            target: ""
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            artifact: libsillstone_ffi.so
            target: ""
          - platform: darwin-arm64
            os: macos-latest
            artifact: libsillstone_ffi.dylib
            target: ""
          - platform: darwin-x64
            os: macos-latest
            artifact: libsillstone_ffi.dylib
            target: x86_64-apple-darwin
          - platform: win32-x64
            os: windows-latest
            artifact: sillstone_ffi.dll
            target: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add Cross-Compile Target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Build FFI cdylib
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build -p sillstone-ffi --release --target ${{ matrix.target }}
            mkdir -p target/release
            cp target/${{ matrix.target }}/release/${{ matrix.artifact }} target/release/
          else
            cargo build -p sillstone-ffi --release
          fi
        shell: bash
      - name: Upload cdylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdylib-${{ matrix.platform }}
          path: target/release/${{ matrix.artifact }}
          if-no-files-found: error
      - name: Build N-API addon
        shell: bash
        run: |
          export SILLSTONE_FFI_DIR="$(pwd)/target/release"
          export SILLSTONE_NAPI_OUT="$(pwd)/target/release/napi"
          if [ -n "${{ matrix.target }}" ]; then
            export SILLSTONE_NAPI_ARCH=x86_64
          fi
          node sdk/node/scripts/build.js
      - name: Smoke-test N-API addon next to its cdylib
        if: matrix.target == ''
        shell: bash
        run: node scripts/ci/smoke-napi.js "target/release/napi/sillstone_napi.node" "target/release/${{ matrix.artifact }}"
      - name: Upload N-API addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.platform }}
          path: target/release/napi/sillstone_napi.node
          if-no-files-found: error
      - name: Set up Python for wheel packaging
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Python wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build wheel
          export SILLSTONE_CDYLIB_DIR="$(pwd)/target/release"
          if [ -n "${{ matrix.target }}" ]; then
            export SILLSTONE_TARGET_ARCH="x86_64"
          fi
          python -m build --wheel sdk/python
          if [ "${{ runner.os }}" == "Linux" ]; then
            python -m pip install auditwheel
            auditwheel repair sdk/python/dist/*.whl -w sdk/python/dist/repaired/ || true
            if ls sdk/python/dist/repaired/*.whl 1> /dev/null 2>&1; then
              rm -f sdk/python/dist/*.whl
              mv sdk/python/dist/repaired/*.whl sdk/python/dist/
              rm -rf sdk/python/dist/repaired
            fi
          fi
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: sdk/python/dist/*.whl
          if-no-files-found: error

  package-sdks:
    name: Package Multi-Language SDKs
    needs: [build-cdylib]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download cdylib artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-libs
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: sdk/python/dist
          merge-multiple: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Stage native prebuilds for npm & Java
        shell: bash
        run: |
          mkdir -p sdk/node/prebuilds/linux-x64 sdk/node/prebuilds/linux-arm64 sdk/node/prebuilds/darwin-arm64 sdk/node/prebuilds/darwin-x64 sdk/node/prebuilds/win32-x64
          cp native-libs/cdylib-linux-x64/libsillstone_ffi.so sdk/node/prebuilds/linux-x64/
          cp native-libs/cdylib-linux-arm64/libsillstone_ffi.so sdk/node/prebuilds/linux-arm64/
          cp native-libs/cdylib-darwin-arm64/libsillstone_ffi.dylib sdk/node/prebuilds/darwin-arm64/
          cp native-libs/cdylib-darwin-x64/libsillstone_ffi.dylib sdk/node/prebuilds/darwin-x64/
          cp native-libs/cdylib-win32-x64/sillstone_ffi.dll sdk/node/prebuilds/win32-x64/
          for p in linux-x64 linux-arm64 darwin-arm64 darwin-x64 win32-x64; do
            cp "native-libs/napi-$p/sillstone_napi.node" "sdk/node/prebuilds/$p/"
          done

          mkdir -p sdk/java/src/main/resources/io/github/sillstone/native/linux-x64
          mkdir -p sdk/java/src/main/resources/io/github/sillstone/native/linux-arm64
          mkdir -p sdk/java/src/main/resources/io/github/sillstone/native/darwin-arm64
          mkdir -p sdk/java/src/main/resources/io/github/sillstone/native/darwin-x64
          mkdir -p sdk/java/src/main/resources/io/github/sillstone/native/win32-x64
          cp native-libs/cdylib-linux-x64/libsillstone_ffi.so sdk/java/src/main/resources/io/github/sillstone/native/linux-x64/
          cp native-libs/cdylib-linux-arm64/libsillstone_ffi.so sdk/java/src/main/resources/io/github/sillstone/native/linux-arm64/
          cp native-libs/cdylib-darwin-arm64/libsillstone_ffi.dylib sdk/java/src/main/resources/io/github/sillstone/native/darwin-arm64/
          cp native-libs/cdylib-darwin-x64/libsillstone_ffi.dylib sdk/java/src/main/resources/io/github/sillstone/native/darwin-x64/
          cp native-libs/cdylib-win32-x64/sillstone_ffi.dll sdk/java/src/main/resources/io/github/sillstone/native/win32-x64/
      - name: Package npm tarball and Java JAR
        shell: bash
        run: |
          cd sdk/node && npm pack
          cd ../../sdk/java && mvn package -DskipTests
      - name: Verify Package Contents Gate
        shell: bash
        run: |
          echo "Verifying unit tests..."
          python -m unittest discover -s scripts/ci -p "test_*.py"
          echo "Verifying Python wheels..."
          python scripts/ci/check-package-contents.py wheels "sdk/python/dist/*.whl" --platforms linux-x64,linux-arm64,darwin-arm64,darwin-x64,win32-x64 --stem sillstone_ffi
          echo "Verifying npm tarball..."
          python scripts/ci/check-package-contents.py npm "sdk/node/*.tgz" --platforms linux-x64,linux-arm64,darwin-arm64,darwin-x64,win32-x64 --stem sillstone_ffi --addon-stem sillstone_napi
          echo "Installing npm tarball into a clean project (linux-x64)..."
          SMOKE="$(mktemp -d)"
          (cd "$SMOKE" && npm init -y >/dev/null && npm install "$GITHUB_WORKSPACE"/sdk/node/*.tgz && node "$GITHUB_WORKSPACE/scripts/ci/smoke-npm.js")
          echo "Verifying Java JAR..."
          python scripts/ci/check-package-contents.py jar "sdk/java/target/*.jar" --platforms linux-x64,linux-arm64,darwin-arm64,darwin-x64,win32-x64 --stem sillstone_ffi --prefix io/github/sillstone/native
      - name: Upload packaged SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-sdks
          path: |
            sdk/python/dist/*.whl
            sdk/node/*.tgz
            sdk/java/target/*.jar

  publish:
    name: Publish Packages to Registries
    needs: [package-sdks]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download packaged SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: packaged-sdks
          path: artifacts
      - name: Organize downloaded SDK artifacts
        shell: bash
        run: |
          mkdir -p sdk/python/dist sdk/node sdk/java/target
          find artifacts -name "*.whl" -exec cp {} sdk/python/dist/ \;
          find artifacts -name "*.tgz" -exec cp {} sdk/node/ \;
          find artifacts -name "*.jar" -exec cp {} sdk/java/target/ \;
          find sdk/python/dist -name "*linux_*.whl" ! -name "*manylinux*" ! -name "*musllinux*" -delete
          ls -la sdk/python/dist sdk/node sdk/java/target
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: 'https://registry.npmjs.org'
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Publish Crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; refusing to report a publish that did not happen."
            exit 1
          fi
          publish_crate() {
            local out
            if out=$(cargo publish --manifest-path "$1/Cargo.toml" 2>&1); then
              echo "$out"
            elif echo "$out" | grep -q "already exists"; then
              echo "$1: already published, skipping"
            else
              echo "$out"
              return 1
            fi
          }
          {
            echo "Publishing crates to crates.io in dependency order..."
            CRATES=(
              crates/buffer
              crates/digest
              crates/math
              crates/inflate
              crates/unicode
              crates/flac
              crates/mp3
              crates/mp4
              crates/h264
              crates/qoi
              crates/tensor
              crates/image
              crates/png
              crates/jpeg
              crates/cdc
              crates/zip
              crates/pdf
              crates/text
              crates/audio
              crates/video
              crates/file
              crates/curator
              crates/cli
              crates/ffi
            )
            for c in "${CRATES[@]}"; do
              echo "Publishing $c..."
              publish_crate "$c"
              sleep 5
            done
          }
      - name: Publish Python Wheel to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          skip-existing: true
      - name: Publish npm package via Trusted Publisher
        run: |
          cd sdk/node
          TGZ=$(ls *.tgz | tail -1)
          if [ -n "$(npm view "sillstone@${{ inputs.expected_version }}" version 2>/dev/null)" ]; then
            echo "sillstone@${{ inputs.expected_version }} already on npm, skipping"
          elif [[ "${{ inputs.expected_version }}" == *-* ]]; then
            npm publish "$TGZ" --access public --tag beta --provenance
          else
            npm publish "$TGZ" --access public --provenance
          fi
      - name: Publish Java package to Maven Central
        env:
          OSSRH_JIRA_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_JIRA_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          if [ -n "$OSSRH_JIRA_USERNAME" ]; then
            echo "Deploying to Maven Central..."
            cd sdk/java && mvn deploy -DskipTests
          else
            echo "Maven Central credentials not configured. Running package validation."
            cd sdk/java && mvn package -DskipTests
          fi

  release-gate:
    name: Release Gate & Registry Readback
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Registry Readiness
        run: |
          echo "Release type: ${{ env.RELEASE_TYPE }}"
          echo "Expected version: ${{ env.EXPECTED_VERSION }}"
          python -m unittest discover -s scripts/ci -p "test_*.py"
          python scripts/ci/check-registries.py --version "${{ env.EXPECTED_VERSION }}" --only crates,pypi,npm --wait-seconds 300

  github-release:
    name: Tag and GitHub Release
    needs: [release-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from registry and exercise native code
        run: |
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          echo '{"name":"smoke","version":"1.0.0"}' > package.json
          npm install "sillstone@${{ env.EXPECTED_VERSION }}"
          node "$GITHUB_WORKSPACE/scripts/ci/smoke-npm.js"
      - name: Tag commit and publish release object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ env.EXPECTED_VERSION }}"
          for t in "v$V" "sdk/go/v$V"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null 2>&1; then
              echo "$t already exists"
            else
              git tag "$t" && git push origin "refs/tags/$t"
            fi
          done
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "release v$V already exists"
          elif [[ "$V" == *-* ]]; then
            gh release create "v$V" --title "v$V" --generate-notes --verify-tag --prerelease
          else
            gh release create "v$V" --title "v$V" --generate-notes --verify-tag
          fi
