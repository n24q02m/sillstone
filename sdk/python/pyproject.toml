[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sillstone"
version = "0.3.0b2"
description = "Pure-Rust zero-dependency multimedia, hashing, and array computing suite"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sillstone Contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/n24q02m/sillstone"
Repository = "https://github.com/n24q02m/sillstone"

[tool.setuptools.package-data]
sillstone = ["*.dll", "*.so", "*.dylib"]
