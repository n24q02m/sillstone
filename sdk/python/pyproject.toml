[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sillstone"
version = "0.2.0b1"
description = "Pure-Rust zero-dependency multimedia, hashing, and array computing suite"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sillstone Contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/sillstone/sillstone"
Repository = "https://github.com/sillstone/sillstone"
