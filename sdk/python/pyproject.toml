[build-system]
# setup.py imports `setuptools.command.bdist_wheel` to retag the wheel
# `py3-none-<platform>`; that module only exists from setuptools 70.1. Declaring
# 61 let a `--no-build-isolation` install fail on ImportError before it built
# anything.
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sillstone"
version = "0.3.1b1"
description = "Pure-Rust zero-dependency multimedia, hashing, and array computing suite"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sillstone Contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/n24q02m/sillstone"
Repository = "https://github.com/n24q02m/sillstone"

[tool.setuptools]
# Explicit: the sdist stages the Rust workspace as `rust/` beside the package and
# flat-layout autodiscovery refuses two top-level directories.
packages = ["sillstone"]

[tool.setuptools.package-data]
sillstone = ["*.dll", "*.so", "*.dylib"]
