[workspace]
resolver = "2"
members = [
    "crates/buffer",
    "crates/digest",
    "crates/math",
    "crates/inflate",
    "crates/unicode",
    "crates/flac",
    "crates/mp3",
    "crates/zip",
    "crates/pdf",
    "crates/mp4",
    "crates/h264",
    "crates/image",
    "crates/png",
    "crates/jpeg",
    "crates/qoi",
    "crates/audio",
    "crates/text",
    "crates/cdc",
    "crates/file",
    "crates/video",
    "crates/curator",
    "crates/cli",
    "crates/tensor",
    "crates/ffi",
    "tools/idl-gen",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.85.0"
authors = ["Sillstone Contributors"]
license = "Apache-2.0"
repository = "https://github.com/n24q02m/sillstone"
homepage = "https://github.com/n24q02m/sillstone"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
[profile.test]
opt-level = 2
